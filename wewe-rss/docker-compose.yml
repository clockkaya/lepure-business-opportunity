version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: opportunity-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: 'Asia/Shanghai'
      MYSQL_DATABASE: 'wewe-rss'
    ports:
      # 防止和宿主机或其他容器的 3306 端口冲突
      - 3308:3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 45s
      interval: 10s
      retries: 10

  app:
    build: .
    image: lepure/wewe-rss:2.6.1
    container_name: wewe-rss
    ports:
      - 4000:4000
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_TYPE=${DATABASE_TYPE}
      - AUTH_CODE=${AUTH_CODE}
      - FEED_MODE=${FEED_MODE}
      - CRON_EXPRESSION=${CRON_EXPRESSION}
      - MAX_REQUEST_PER_MINUTE=${MAX_REQUEST_PER_MINUTE}
      - UPDATE_DELAY_TIME=${UPDATE_DELAY_TIME}
      - ENABLE_CLEAN_HTML=${ENABLE_CLEAN_HTML}
      - SERVER_ORIGIN_URL=${SERVER_ORIGIN_URL}
      - PLATFORM_URL=${PLATFORM_URL}

networks:
  wewe-rss:

volumes:
  db_data:
